name: CI Pipeline

on:
  push:
    branches: [main, portfolio-v3]
  pull_request:
    branches: [main, portfolio-v3]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build Next.js application
        run: npm run build
